<!DOCTYPE html>
<html>

<head>

    <title>Student Planner - Planner</title>

    <link rel="stylesheet" href="css/planner.css">

</head>


<body>


<div class="app-layout">



    <!-- SIDEBAR -->

<aside id="sidebar">

    <div class="sidebar-content">

        <img 
        src="assets/actual logo.png" 
        alt="Student planner logo" 
        id="logo">

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="planner.html">
                Planner
            </a>

            <a href="calendar.html">
                Calender
            </a>

        </nav>

    </div>

</aside>


<!-- MAIN CONTENT -->

<main>


    <!-- GREETING CARD -->

    <div class="planner-section">

        <div class="greeting-section">

            <h1>
                Let's plan your study
            </h1>

            <p>
                Nothing will work unless you do
            </p>

        </div>

    </div>



    <!-- PLANNER GRID -->

    <div class="planner-grid">


        <!-- SUBJECT CARD -->

        <div class="subject-card">

            <h3>
                My Subjects
            </h3>

            <p>
                Add your school subjects once
            </p>


            <div class="subject-input-section">

                <input
                id="subjectInput"
                type="text"
                placeholder="Enter subject">


                <button
                type="button"
                id="addSubjectButton">

                    Add subject

                </button>

            </div>


            <ul id="subjectList"></ul>

        </div>



        <!-- STUDY SESSION CARD -->

        <div class="study-session-card">

            <h3>
                Create Study Session
            </h3>


            <label for="subjectDropdown">
                Subject
            </label>

            <select id="subjectDropdown">

                <option value="" selected disabled>
                    Select Subject
                </option>

            </select>


            <label for="topicInput">
                Topic
            </label>

            <input
            type="text"
            id="topicInput"
            placeholder="What are you studying?">


            <label for="sessionDate">
                Date
            </label>

            <input
            type="date"
            id="sessionDate">


            <label for="sessionTime">
                Time
            </label>

            <input
            type="time"
            id="sessionTime">


            <button
            type="button"
            id="addSessionButton">

                Add Study Session

            </button>

        </div>



        <!-- ==========================
        STUDY TIMER
        ========================== -->

        <div class="timer-card">

            <div class="timer-header">

                <h3>
                    Study Timer
                </h3>

                <p>
                    Focus for 25 minutes
                </p>

            </div>


            <div class="timer-display">

                <span id="timerMinutes">
                    25
                </span>

                <span class="timer-colon">
                    :
                </span>

                <span id="timerSeconds">
                    00
                </span>

            </div>


            <div class="timer-status" id="timerStatus">

                Ready to focus? 📚

            </div>


            <div class="timer-buttons">

                <button
                type="button"
                id="startTimerButton">

                    Start

                </button>


                <button
                type="button"
                id="pauseTimerButton">

                    Pause

                </button>


                <button
                type="button"
                id="resetTimerButton">

                    Reset

                </button>

            </div>

        </div>



        <!-- ==========================
        UPCOMING SESSIONS
        ========================== -->

        <div class="sessions-card">

            <h3>
                Upcoming Study Sessions
            </h3>

            <ul id="sessionList"></ul>

        </div>


    </div>


</main>




</div>






<script src="js/planner.js"></script>


</body>


</html>
