<!DOCTYPE html>
<html>

<head>
         <link rel="stylesheet" href="/css/style.css">

    </head>
<body>
    <main>
        <img src="/assets/actual logo.png" alt="Logo" id="logo">
        <h1>Welcome!!</h1>

        <p>Let's get you ready for a productive study session.</p>

        <form id="login-form">
                <label for="name-field">Your name:</label>
                <input 
                type="text" 
                id="name-field"
                placeholder="Enter your name"
                required>

                <label for="email-field">Email:</label>
                <input 
                type="email" 
                id="email-field"
                placeholder="Enter your email">

            
                <button 
                id="loginButton"
                type="button">Sign in</button>

        </form>

            




    </main>

  <script src="js/login.js"></script>
</body>
</html>
