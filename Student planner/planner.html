<!DOCTYPE html>
<html>
    <head>
         <link rel="stylesheet" href="/Student planner/css/planner.css">

    </head>
    <body>
         <aside id="sidebar">
            <div class="sidebar-content">
            <img src="../Student planner/assets/actual logo.png" alt="Student planner logo" id="logo">
                <nav>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="planner.html">Planner</a>
                </nav>
            </div>
            </aside>

        <main>
            <div class="planner-section">

                <!--Greeting card-->

                <div class="greeting-section">
                    <h1>Let's plan your study</h1>
                    <p>Nothing will work unless you do</p>
                </div>
            </div>
            
            <!--Planner grid-->

            <div class="planner-grid">
                
                <!--Subject card-->

                <div class="subject-card">
                    <h3>My Subjects</h3>
                    <p>
                        Add your school subjects once
                    </p>

                    <div class="subject-input-section">
                        <input
                        id="subjectInput"
                        type="text"
                        placeholder="Enter subject"
                        required>

                        <button
                        type="button"
                        id="addSubjectButton"
                       >Add subject</button>
                    </div>

                    <ul id="subjectList"></ul>
                </div>

                <!--Study session card-->

                <div class="study-session-card">
                    <h3>Create study session</h3>

                    <label
                    for="subjectDropdown">Subject</label>
                    <select id="subjectDropdown">

                        <option value="" selected disabled>

                            Select Subject

                        </option>

                    </select>

                    <label
                    for="subjectTopic">Topic</label>

                    <input
                        type="text"
                        id="topicInput"
                        placeholder="What are you studying?"
                        required>

                    <label
                    for="sessionDate">Date</label>

                    <input
                        type="date"
                        id="sessionDate"
                        required>

                    <label
                    for="sessionTime">Time</label>

                    <input
                        type="time"
                        id="sessionTime"
                        required>

                    <button 
                    type="button"
                    id="addSessionButton">

                        Add Study Session

                    </button>

                </div>

                <!-- UPCOMING SESSIONS -->

                <div class="sessions-card">

                    <h3>Upcoming Study Sessions</h3>

                    <ul id="sessionList"></ul>

                </div>


            </div>


        </main>

    </body>


</html>
